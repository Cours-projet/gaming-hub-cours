<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PlayHub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="assets/images/logo.png" alt="PlayHub Logo" class="logo" style="width: 80px; height: 80px;">
            <h1 style="font-size: 3rem;">PlayHub</h1>
            <a href="index.html" class="back-link">← Retour à l'accueil</a>
        </header>

        <main class="card" style="max-width: 600px; margin: 0 auto;">
            <div id="error-message" style="display: none;"></div>
            <div id="success-message" style="display: none;"></div>

            <!-- Onglets -->
            <div class="tab-buttons">
                <button id="tab-login" class="btn btn-primary" onclick="showTab('login')">
                    Connexion
                </button>
                <button id="tab-signup" class="btn btn-outline" onclick="showTab('signup')">
                    Créer un compte
                </button>
            </div>

            <!-- Formulaire de connexion -->
            <div id="login-section">
                <h2 style="margin-bottom: 2rem; text-align: center; color: var(--text);">
                    Bon retour
                </h2>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="votre@email.com" autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                        Se Connecter
                    </button>
                </form>
            </div>

            <!-- Formulaire d'inscription -->
            <div id="signup-section" style="display: none;">
                <h2 style="margin-bottom: 2rem; text-align: center; color: var(--text);">
                    Rejoignez-nous
                </h2>
                
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-username">Pseudo (3-20 caractères)</label>
                        <input 
                            type="text" 
                            id="signup-username" 
                            required 
                            placeholder="VotrePseudo" 
                            minlength="3"
                            maxlength="20"
                            pattern="[a-zA-Z0-9_-]+"
                            title="Lettres, chiffres, - et _ uniquement"
                            autocomplete="username"
                        >
                        <small>Lettres, chiffres, tirets et underscores uniquement</small>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" required placeholder="votre@email.com" autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-password">Mot de passe (min. 6 caractères)</label>
                        <input 
                            type="password" 
                            id="signup-password" 
                            required 
                            placeholder="••••••••" 
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signup-password-confirm">Confirmer le mot de passe</label>
                        <input 
                            type="password" 
                            id="signup-password-confirm" 
                            required 
                            placeholder="••••••••"
                            autocomplete="new-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                        Créer mon compte
                    </button>
                </form>
            </div>

            <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                <p style="color: var(--text-dim); font-size: 0.85rem;">
                    En créant un compte, vous acceptez de jouer fair-play
                </p>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Lycée Albert Einstein - Développé par Tomy, Tom & Lancelot</p>
        </footer>
    </div>

    <script>
        function showTab(tab) {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginSection.style.display = 'block';
                signupSection.style.display = 'none';
                loginTab.className = 'btn btn-primary';
                signupTab.className = 'btn btn-outline';
            } else {
                loginSection.style.display = 'none';
                signupSection.style.display = 'block';
                loginTab.className = 'btn btn-outline';
                signupTab.className = 'btn btn-secondary';
            }
        }
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
